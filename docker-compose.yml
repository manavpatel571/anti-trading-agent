version: '3.8'

services:
  db:
    image: timescale/timescaledb:latest-pg15
    container_name: anti_trading_db
    environment:
      POSTGRES_DB: anti_trading
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7.2-alpine
    container_name: anti_trading_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

volumes:
  db_data:
  redis_data:
