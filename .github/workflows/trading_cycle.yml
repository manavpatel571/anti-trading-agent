name: Agentic Trading Cycle

on:
  schedule:
    # Indian Stock Market hours: 9:15 AM to 3:30 PM IST (Mon-Fri)
    # UTC Equivalent: 03:45 to 10:00 UTC
    - cron: '45 3 * * 1-5'      # 9:15 AM IST
    - cron: '*/15 4-9 * * 1-5'  # 9:30 AM to 3:15 PM IST (runs every 15m)
    - cron: '0 10 * * 1-5'      # 3:30 PM IST

  # Allow running manually from the GitHub Actions tab
  workflow_dispatch:

jobs:
  run-trading-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3
      with:
        # Important: fetch full history so we can push back to the repo
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .

    - name: Run Trading Cycle
      env:
        RUN_ONCE: "True"
        DRY_RUN: "True"
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
        DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
      run: |
        python main.py

    - name: Commit and Push Ledger Updates
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        # Check if the ledger was modified
        if [[ `git status --porcelain data/ledger.json` ]]; then
          git add data/ledger.json
          git commit -m "chore: Auto-update Paper Trading Ledger [skip ci]"
          git push
        else
          echo "No ledger updates to commit."
        fi
