[project]
name = "anti-trading-agent"
version = "0.1.0"
description = "A production-grade, SEBI-compliant, multi-agent AI trading system"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.0.26",
    "langchain>=0.1.12",
    "langchain-core>=0.1.33",
    "langchain-google-genai>=1.0.1",
    "langchain-anthropic>=0.1.4",
    "pydantic>=2.6.4",
    "pydantic-settings>=2.2.1",
    "sqlalchemy>=2.0.29",
    "psycopg2-binary>=2.9.9",
    "redis>=5.0.3",
    "pandas>=2.2.1",
    "numpy>=1.26.4,<2.0.0",
    "TA-Lib>=0.4.28",
    "scipy>=1.12.0",
    "statsmodels>=0.14.1",
    "python-dotenv>=1.0.1",
    "kiteconnect>=5.0.1",
    "pyotp>=2.9.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "dhanhq>=1.2.0",
    "pandas-ta==0.3.14b0",
    "yfinance>=0.2.37",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
